services:
  quizzy:
    build: .
    container_name: quizzy
    restart: unless-stopped
    ports:
      - "7111:7111"
    environment:
      - NODE_ENV=production
      - PORT=7111
      - CLIENT_URL=${CLIENT_URL:-http://localhost:7111}
    volumes:
      # Mount categories.json so you can edit it without rebuilding
      - ./server/categories.json:/app/server/categories.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7111/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
