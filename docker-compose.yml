services:
  quizzy:
    build: .
    container_name: quizzy
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3001}
    volumes:
      # Mount genres.json so you can edit it without rebuilding
      - ./server/genres.json:/app/server/genres.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/genres"]
      interval: 30s
      timeout: 10s
      retries: 3
